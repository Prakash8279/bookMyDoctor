<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookMyDoctors — Book Doctor Appointments &amp; Track Live Queues Online</title>
    <meta name="description" content="BookMyDoctors helps you find verified doctors, book clinic appointments instantly, and track live queue tokens in real-time. Book your doctor consultation today." />
    <meta name="keywords" content="BookMyDoctors, BookMyDoctor, Book My Doctor, bookmydoctors.me, book doctor online, doctor appointment booking, clinic live queue, find doctors near me, book doctor consultation" />
    <link rel="canonical" href="https://bookmydoctors.me/" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Social & Search Preview Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BookMyDoctors" />
    <meta property="og:url" content="https://bookmydoctors.me/" />
    <meta property="og:title" content="BookMyDoctors — Book Doctor Appointments &amp; Track Live Queues Online" />
    <meta property="og:description" content="Find verified doctors, book clinic appointments, and track live queue tokens from home with BookMyDoctors." />
    <meta property="og:image" content="https://bookmydoctors.me/favicon.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BookMyDoctors — Book Doctor Appointments Online" />
    <meta name="twitter:description" content="Find verified doctors, book clinic appointments, and track live queue tokens from home with BookMyDoctors." />
    <meta name="twitter:image" content="https://bookmydoctors.me/favicon.png" />

    <!-- Google Structured Data (WebSite + MedicalOrganization + Sitelinks) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://bookmydoctors.me/#website",
          "url": "https://bookmydoctors.me/",
          "name": "BookMyDoctors",
          "alternateName": ["Book My Doctor", "BookMyDoctor", "BookMyDoctors.me"],
          "description": "Book doctor appointments and track live clinic queues online.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://bookmydoctors.me/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "MedicalOrganization",
          "@id": "https://bookmydoctors.me/#organization",
          "name": "BookMyDoctors",
          "alternateName": ["BookMyDoctor", "Book My Doctor"],
          "url": "https://bookmydoctors.me/",
          "logo": "https://bookmydoctors.me/favicon.png",
          "image": "https://bookmydoctors.me/favicon.png",
          "description": "Verified doctors, instant appointments, and live clinic queues in one healthcare platform.",
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "Customer Support",
            "email": "support@bookmydoctors.me"
          }
        }
      ]
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <!-- Razorpay's Checkout widget used to be loaded globally here with a plain <script> tag,
         which blocked every page's load (not just the payment screen) until it finished — see
         razorpay-script-loading-fix-plan.md. It's now loaded on demand from
         src/lib/loadRazorpayScript.js, used by src/pages/PatientPages.jsx#Booking. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
