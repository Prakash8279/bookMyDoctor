# Serves the Vite-built SPA. Two things a plain static-file server gets wrong for a
# react-router-dom app, fixed here:
#   1. `try_files ... /index.html` — a hard refresh on a deep route like /admin/settings must
#      still return index.html (so the router can take over client-side), not a raw nginx 404.
#   2. Long-lived caching for hashed build assets (Vite fingerprints filenames), but NOT for
#      index.html itself — otherwise browsers/CDNs could serve a stale index.html pointing at
#      JS/CSS bundles that no longer exist after a new deploy.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite output filenames are content-hashed (e.g. index-4f9a1c2b.js), so caching them
    # aggressively is safe — a changed file gets a new name, never a stale cache hit.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
