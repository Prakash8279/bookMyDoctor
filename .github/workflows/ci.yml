name: CI

# Runs on every push and every pull request. Nothing here needs a real Postgres/Redis: every
# existing backend test (unit + integration) mocks config/db and config/redis at the boundary
# (see server/server/tests/setupEnv.js and tests/integration/*.test.js's own header comments) —
# so no service containers are wired up here on purpose, not by oversight.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client-test:
    name: Client (React) — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # vitest 5 (client/node_modules/vitest's own package.json "engines") requires Node
          # ^22.12.0 || ^24.0.0 || >=26.0.0 — jsdom 30's bundled undici calls a webidl helper
          # that doesn't exist on Node 20, crashing every test file with "webidl.util.
          # markAsUncloneable is not a function" the moment jsdom's CacheStorage loads. Node 20
          # here reproduced that exact crash; 22 matches what vitest actually supports.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test

  server-test:
    name: Server (Node/Express) — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/server/package-lock.json
      - run: npm ci
      # Run serially (--runInBand), not with npm test's default parallel worker pool: GitHub-
      # hosted runners are memory/CPU-constrained enough that Jest's worker processes were
      # crashing mid-suite (each crash showing up as "process.exit called with 1" inside
      # config/env.js, then "Jest worker encountered N child process exceptions, exceeding
      # retry limit" once Jest gave up retrying that worker) — a CI-resource problem, not a bug
      # in the tests themselves. Serial execution is slower but doesn't depend on how many
      # workers the runner can actually sustain at once. `npm test` (parallel) is still what
      # local development uses.
      - run: npx jest --runInBand

  mobile-test:
    name: Mobile (Flutter) — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      # integration_test/ needs a real device/emulator, which this runner doesn't have — only
      # the plain widget/unit tests under test/ run in CI. integration_test/app_test.dart still
      # needs to be run by hand on a real device (flutter test integration_test/app_test.dart -d
      # <device>) before you trust it; that's a separate, already-flagged manual step.
      - run: flutter test test/

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t bookmydoctor24-server:ci ./server/server
      - name: Build client image
        run: docker build -t bookmydoctor24-client:ci ./client
