name: connect_mobile
description: "BookADoctors - mobile app for Patient, Doctor, Receptionist and Admin roles, backed by the same Node/Express/PostgreSQL API as the web app."
publish_to: 'none'
version: 1.0.1+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.3
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  # COMPLETENESS FIX (audit Priority 3 #3 — mobile parity): patient online self-pay via Razorpay
  # — see screens/patient/payment_required_screen.dart. Run `flutter pub get` after pulling this.
  razorpay_flutter: ^1.3.7
  # COMPLETENESS FIX (audit Priority 3 #8 — mobile parity): profile photo / doctor verification
  # document / clinic payment-QR uploads — see core/api_client.dart#uploadFile and
  # screens/shared/profile_screen.dart. http_parser is already a transitive dependency of dio
  # (used for its own multipart content-type handling) — listed directly here too since
  # api_client.dart imports it explicitly for MediaType. Run `flutter pub get` after pulling this.
  image_picker: ^1.2.3
  http_parser: ^4.0.2
  # COMPLETENESS FIX (mobile parity — client/src/pages/FeaturePages.jsx#PatientEmergencyBooking):
  # "Call now" button on screens/patient/emergency_booking_screen.dart dials a clinic's phone
  # number via the device dialer. Run `flutter pub get` after pulling this.
  url_launcher: ^6.3.1
  # COMPLETENESS FIX (brand consistency — user asked the app to look "same to same" as the
  # website): theme/app_theme.dart now renders the whole app in Inter, matching the website's own
  # actual font (reference_site.css's base font-family rule — Inter, not the unused Poppins/Jakarta
  # entries also present in the web repo's tailwind config). Fetched from Google Fonts at first run
  # and cached; run `flutter pub get` after pulling this.
  google_fonts: ^6.2.1
  # GOOGLE SIGN-IN FEATURE (user request: "google work nahi kar rah hai fix kro") — the native
  # Google account picker for "Continue with Google" on screens/auth/login_screen.dart and
  # register_screen.dart. See lib/core/google_auth_config.dart for the ONE value you still need
  # to fill in (a Client ID — not a secret, safe to commit) before this actually works, and that
  # file's own comment for why nothing else can be wired up yet (no android/ or ios/ platform
  # folder exists in this repo — see mobile/README.md's Prerequisites section — Android/iOS
  # Google Cloud setup only becomes possible once `flutter create .` has generated them). Run
  # `flutter pub get` after pulling this.
  google_sign_in: ^6.2.2
  # CRASH REPORTING & CONNECTIVITY: reports uncaught errors/crashes to Sentry — see lib/main.dart's
  # `_sentryDsn` (only initialized when a SENTRY_DSN is supplied via --dart-define; the app runs
  # exactly the same with none configured, which is every build made in this sandbox). See
  # README.md's "Crash reporting & connectivity" section. Run `flutter pub get` after pulling this.
  sentry_flutter: ^9.0.0
  # CRASH REPORTING & CONNECTIVITY: powers widgets/connectivity_banner.dart's "No internet
  # connection" banner (mounted in widgets/role_scaffold.dart). Run `flutter pub get` after
  # pulling this.
  connectivity_plus: ^6.0.5
  # COMPLETENESS FIX (mobile parity audit): powers the "Export CSV" actions ported from the web
  # app's client/src/lib/csv.js (buildCsv/downloadCsv) — see core/csv_export.dart. Uses the plain
  # text-share path (Share.share) rather than a temp-file share, so no extra path_provider
  # dependency is needed. Run `flutter pub get` after pulling this.
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  # integration_test:
  #   sdk: flutter
  flutter_lints: ^4.0.0
  # COMPLETENESS FIX (brand consistency): generates the real Android/iOS launcher icon files from
  # assets/branding/app_icon.png (the same heart-pulse-on-terracotta mark now used as the web
  # favicon, and in login_screen.dart/splash_screen.dart/guest_home_screen.dart below). Run
  # `flutter pub get` then `dart run flutter_launcher_icons` after pulling this — that second
  # command is what actually writes the android/ and ios/ icon files; nothing changes until it's
  # run.
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  # No ios/ platform folder exists in this project (Android-only so far), so generating an iOS
  # icon fails looking for a placeholder AppIcon.appiconset that was never created. Flip this back
  # to true once `flutter create --platforms=ios .` (or similar) has added the ios/ folder.
  ios: false
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
