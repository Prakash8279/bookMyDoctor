# LOAD-BALANCING FIX (docs/load-balancing-check-2026-09-20.md — "docker-compose.yml's `server`
# service binds host port 4000 directly, so `docker compose up --scale server=N` fails outright:
# replicas beyond the first can't bind the same host port"). This nginx service is what now owns
# host port 4000 — `server` itself no longer publishes a port at all (see docker-compose.yml) — and
# spreads requests across every `server` replica that exists, so scaling the API is just
# `docker compose up -d --scale server=3` away instead of needing an application-code change.
#
# TRUST_PROXY_HOPS: this nginx sits as exactly ONE reverse-proxy hop in front of the API, which is
# already what config/env.js#trustProxyHops defaults to (1) even with no .env entry at all — see
# .env.example's own comment on that variable. No backend code or env change is needed for this
# fix; req.ip (used by the rate limiters, the admin IP allowlist, and activity-log entries)
# continues to resolve to the real client address exactly as it did with `server` directly
# exposed, because the X-Forwarded-For / X-Real-IP headers set below are the standard shape
# Express's trust-proxy handling already expects.
upstream api_backend {
    # Docker Compose's embedded DNS (127.0.0.11) resolves the `server` service name to every
    # currently-running replica's IP. Plain nginx open-source (no NGINX Plus) resolves this once
    # at startup/reload and load-balances round-robin (the default algorithm — no `least_conn`/
    # `ip_hash` directive needed for a stateless JSON API) across whatever replica set existed at
    # that moment. SCALING CAVEAT: if you scale server UP or DOWN while nginx is already running,
    # reload it so it re-resolves the current replica set:
    #   docker compose up -d --scale server=3
    #   docker compose exec nginx nginx -s reload
    # (or simplest: bring the whole stack up with the desired --scale from a cold start, so nginx
    # never starts against a stale replica count in the first place). This is a known limitation
    # of nginx's static (non-dynamic) upstream resolution, not a bug in this config — reaching for
    # NGINX Plus's paid dynamic-resolve feature isn't warranted for a local/staging compose file.
    server server:4000;
}

server {
    listen 80;

    # Matches the app's own largest upload limit (see fileUploadService.js's MAX_DOCUMENT_BYTES) —
    # otherwise nginx's default 1m body-size cap would reject a document upload nginx never even
    # let reach the API, well before the app's own multer limit had a chance to produce its usual
    # translated 400 FILE_TOO_LARGE response.
    client_max_body_size 20m;

    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        # Standard reverse-proxy headers — this is the ONE hop TRUST_PROXY_HOPS=1 (the default,
        # see header comment above) expects req.ip to be derived from.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Booking confirmation can take a few seconds (BullMQ job processing — see
        # appointments.service.js#runBookingJob) and the booking-status poll itself waits up to
        # 40s client-side (useAppStore.js#createAppointment) — keep nginx's own timeouts well
        # above that instead of the 60s default silently being "enough for now" only by luck.
        proxy_connect_timeout 10s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
